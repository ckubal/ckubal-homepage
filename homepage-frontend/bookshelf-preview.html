<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>bookshelf preview</title>
<style>
:root{--bg-color:#111;--text-color:#fff;--text-secondary:#ccc;--inactive-color:#666;--border-color:#333;--gold:#e7cd5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-color);color:var(--text-color);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.01em;padding:40px 24px;overflow-x:hidden}
.wrap{max-width:900px;margin:0 auto}
.stat-lead{font-size:1.15rem;color:var(--text-secondary);text-transform:lowercase;line-height:1.3;margin:0 0 22px;max-width:620px}
.nav{margin:0 0 6px;font-size:1.05rem}
.nav .n{cursor:pointer;text-transform:lowercase;color:var(--inactive-color);font-weight:600}
.nav .n.on{color:var(--text-color);text-decoration:underline;text-underline-offset:4px}
.sep{color:var(--inactive-color);margin:0 10px}
.yearnav{font-size:1.05rem;color:var(--inactive-color);text-transform:lowercase;font-weight:600;margin:0 0 4px}
.yearnav .yn-note{font-size:.7rem;font-weight:400;opacity:.7}
.stat{font-size:.85rem;color:var(--inactive-color);text-transform:lowercase;margin:14px 0 6px}
.shelf-row{position:relative;display:flex;align-items:center;gap:6px}
.arrow{flex:0 0 auto;width:26px;height:26px;border:none;background:none;color:var(--text-color);font-size:1.5rem;cursor:pointer;opacity:.55;line-height:1;padding:0}
.arrow:hover{opacity:1}.arrow[disabled]{opacity:.15;cursor:default}
.shelf-viewport{flex:1 1 auto;perspective:1500px;overflow-x:auto;overflow-y:hidden;padding:30px 0 0;cursor:grab;scrollbar-width:none;scroll-behavior:smooth}
.shelf-viewport::-webkit-scrollbar{display:none}
.shelf-viewport.dragging{cursor:grabbing;scroll-behavior:auto}
.shelf{display:flex;align-items:flex-end;gap:3px;width:max-content;padding:0 4px;border-bottom:2px solid var(--border-color);transform-style:preserve-3d}
.book{position:relative;overflow:hidden;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:16px 0 12px;border-radius:2px 3px 3px 2px;color:#ece7dd;cursor:pointer;user-select:none;box-shadow:inset -6px 0 10px rgba(0,0,0,.28),inset 3px 0 4px rgba(255,255,255,.06),2px 3px 8px rgba(0,0,0,.4);transition:transform .28s cubic-bezier(.2,.8,.2,1);transform-origin:bottom center}
.book:hover{transform:translateY(-10px)}.book.selected{transform:translateY(-22px)}
.book.fav::after{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(180deg,#f7e59a 0%,#e7cd5e 55%,#c9a63f 100%);box-shadow:0 1px 4px rgba(231,205,94,.45)}
.spine-title{writing-mode:vertical-rl;text-orientation:mixed;font-size:.72rem;font-weight:600;text-transform:lowercase;line-height:1.05;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.spine-author{margin-top:auto;padding-top:6px;writing-mode:vertical-rl;text-orientation:mixed;font-size:.5rem;opacity:.7;text-transform:lowercase;max-height:34%;overflow:hidden}
.rating{display:inline-flex;gap:1px;vertical-align:-1px}
.rating .st{position:relative;color:#413b28;font-size:1rem;line-height:1}
.rating .st.full{color:var(--gold)}
.rating .st.half::before{content:'★';position:absolute;left:0;top:0;width:50%;overflow:hidden;color:var(--gold)}
.detail{margin-top:30px;min-height:96px;border-top:1px solid var(--border-color);padding-top:18px;opacity:0;transition:opacity .25s ease}
.detail.show{opacity:1}
.detail .d-title{font-size:1.05rem;font-weight:600;text-transform:lowercase;margin:0}
.detail .d-meta{font-size:.85rem;color:var(--inactive-color);text-transform:lowercase;margin:5px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail .d-summary{font-size:.95rem;color:var(--text-secondary);line-height:1.45;max-width:620px;text-transform:lowercase}
.detail .d-empty{font-size:.95rem;color:var(--inactive-color);text-transform:lowercase;font-style:italic}
</style></head><body><div class="wrap">
<p class="stat-lead">i've read 28 books so far in 2026 (19 non-fiction, 9 fiction). some recent favorites below, and <u>full list here</u>.</p>

<div class="shelf-row"><button class="arrow" id="prev">‹</button><div class="shelf-viewport" id="viewport"><div class="shelf" id="shelf"></div></div><button class="arrow" id="next">›</button></div>

<script>
const DATA = {"year": 2026, "thisyear": [{"month": "july", "monthNum": 7, "rating": "5", "title": "My Friends", "author": "Fredrik Backman", "genre": "F", "comment": "backman really nails what it's like to be a teenager \u2013 that mix of endless possibility and total uncertainty. warm story about friendship and the paintings that outlast us. a little saccharine at times, but genuinely one of my favorite fiction reads in years."}, {"month": "july", "monthNum": 7, "rating": "5", "title": "A Man Called Ove", "author": "Fredrik Backman", "genre": "F", "comment": "read this right after my friends, and glad I did. Backman takes what could've been a cheap caricature of the rigid, rule-obsessed old grump and peels back the grief and tenderness underneath. both funny and parts made me choke up at times. a reminder of how much the people around us shape us without our noticing. strong recommend"}, {"month": "july", "monthNum": 7, "rating": "4.5", "title": "The Inner Game of Tennis", "author": "Timothy Gallwey", "genre": "NF", "comment": "ostensibly about tennis, but really about getting out of your own way at anything. Gallwey's split between Self 1 (the hyper-aware, nagging, over-coaching mind) and Self 2 (the body that already knows how) has stuck with me. Punches way above its page count and makes sense that it's a classic. Highly recommend."}, {"month": "july", "monthNum": 7, "rating": "4", "title": "The Art of Spending Money", "author": "Morgan Housel", "genre": "NF", "comment": "housel's follow-up to psychology of money, scratching the same itch. less about making or saving and more about spending in ways that actually make you happier, which is the part most personal finance skips. nothing revolutionary if you've read his other stuff, but he's such a clear thinker and it's an easy, worthwhile read. recommend."}, {"month": "july", "monthNum": 7, "rating": "4", "title": "Liars", "author": "Sarah Manguso", "genre": "F", "comment": "manguso writes in short, sharp fragments about a marriage slowly curdling, and it's brutal in a way that feels very true. a woman watching her own ambitions get quietly subordinated to her difficult artist husband. not a fun read exactly, but she's so precise about how resentment accumulates. stuck with me."}, {"month": "july", "monthNum": 7, "rating": "4", "title": "Fahrenheit 182", "author": "Mark Hoppus", "genre": "NF", "comment": "I grew up on blink, so this was always going to land, and Mark is as funny and self-deprecating as you'd hope. Also a lot of honesty underneath the funny exterior \u2013 the anxiety, the cancer scare, the insecurity driving a lot of it. A lot of very raw humanity in here, and hearing the story of a band that soundtracked my teenage years in his voice was a real pleasure."}, {"month": "june", "monthNum": 6, "rating": "3.5", "title": "Sellout", "author": "Dan Ozzi", "genre": "NF", "comment": "the story of punk and emo going mainstream through eleven bands signing to majors, and as someone who grew up on a lot of these records it was a nostalgic, fun read. the jimmy eat world and blink chapters especially landed. gets a little repetitive band to band, but if this was your music, worth it."}, {"month": "may", "monthNum": 5, "rating": "4.5", "title": "How to Not Know", "author": "Simone Stolzoff", "genre": "NF", "comment": "rare book on uncertainty that doesn't try to sell you certainty by the end. moves through an sf tech worker who randomized his own life, ocd's clinical hunger for certainty, and the finding that anticipating an uncertain outcome is harder than the outcome itself. what stuck with me: every short-term grab for certainty atrophies our ability to sit with not knowing. accessible, quick read, easy to recommend."}, {"month": "may", "monthNum": 5, "rating": "4", "title": "The War of Art", "author": "Steven Pressfield", "genre": "NF", "comment": "pressfield's idea of resistance as the force that keeps you from your creative work named something i'd felt but never articulated. short, blunt, a little macho in places, but i keep coming back to the core idea. a good nudge for anyone who keeps not starting the thing."}, {"month": "may", "monthNum": 5, "rating": "4", "title": "How to Disappear and Why", "author": "Kyle Minor", "genre": "F", "comment": "essays circling the idea of disappearance from every angle: ghosts, exile, erasing yourself. then he turns that lens inward on his own ambition and want for connection. minor's a sharp writer and this was very strange but stuck with me. wandered in places but i liked where it went."}, {"month": "may", "monthNum": 5, "rating": "4", "title": "Psychology of Money", "author": "Morgan Housel", "genre": "NF", "comment": "the big idea, that doing well with money is more about behavior than intelligence, is simple but he makes it land through great short stories. made me think about my own relationship with saving and risk. not as much technical here, but that's kind of the point. recommend."}, {"month": "may", "monthNum": 5, "rating": "4", "title": "Super Nintendo", "author": "Keza MacDonald", "genre": "NF", "comment": "traces nintendo back to its odd 1889 origins up through mario, zelda, pokemon, with a lot of interviews with the people who built it. macdonald's really good on what makes nintendo nintendo: the stubborn focus on play over specs. one of my favorite parts was a bit about the legend of zelda on the snes had a design ethos of always rewarding curiosity, and i love that concept. i grew up playing that game a ton and it blew my mind for what a game could be. nostalgic and genuinely interesting, even as a casual fan."}, {"month": "may", "monthNum": 5, "rating": "3.5", "title": "Transcription", "author": "Ben Lerner", "genre": "F", "comment": "lerner novel about a narrator going to interview his ninety-year-old mentor, with a lot of meditation on technology and memory and what we hold onto. his prose is good and there are passages i loved, and leaves you a bit off-kilter, which I think was part of the point. enjoyed this one."}, {"month": "may", "monthNum": 5, "rating": "3", "title": "Strangers: A Memoir of Marriage", "author": "Belle Burden", "genre": "NF", "comment": "burden revisits her marriage falling apart during covid, digging back for the signs she missed that her husband wasn't who she thought. honest and occasionally very raw, especially the reckoning with how women are taught to absorb betrayal. fine, though it didn't fully separate itself from other divorce memoirs for me."}, {"month": "may", "monthNum": 5, "rating": "2.5", "title": "More Everything Forever", "author": "Adam Becker", "genre": "NF", "comment": "Becker goes after the grand techno-utopian visions of the AI-and-Mars set, and I'm sympathetic to the skepticism. But it reads more as polemic than argument, and he really could have used both an editor and someone pushing back on some of his ideas to better sharpen his points."}, {"month": "april", "monthNum": 4, "rating": "3.5", "title": "Notes on Being a Man", "author": "Scott Galloway", "genre": "NF", "comment": "galloway on masculinity and how young men are struggling, mixed with his own story from a rough childhood to raising two boys. i don't agree with all of it, and \"protect, provide, procreate\" is a little reductive, but he's honest about his own anger and mistakes and there's real practical advice here. worth it, especially if you're raising boys."}, {"month": "february", "monthNum": 2, "rating": "4", "title": "Flesh", "author": "David Szalay", "genre": "F", "comment": "won the booker and i get why. follows a detached, passive hungarian man from a teenage trauma up through an accidental rise into london wealth. the flatness of the prose mirrors the flatness in him, which is a strange trick that really works. dark and a little cold, but i couldn't stop reading it. recommend."}, {"month": "february", "monthNum": 2, "rating": "3.5", "title": "Project Hail Mary", "author": "Andy Weir", "genre": "F", "comment": "a lone guy solving one science problem after another to save earth, this time with amnesia and an alien companion. the friendship with rocky is charming and i moved through it fast. the solve-repeat structure wears a little thin by the end, but it's fun and propulsive."}, {"month": "february", "monthNum": 2, "rating": "3", "title": "Cudi", "author": "Scott Mescudi", "genre": "NF", "comment": "cudi's memoir. he gets pretty real about the depression, addiction, and isolation, and shares real moments of vulnerability. glad I read it and got more context on his story, and helped me appreciate more of his journey and the artist he's become"}, {"month": "february", "monthNum": 2, "rating": "3", "title": "A Life's Work", "author": "Rachel Cusk", "genre": "NF", "comment": "cusk on early motherhood, about as unsentimental as everyone says. she's honest about the ambivalence and loss of self in a way that must've been bracing when it came out. i appreciated the refusal to romanticize it, though the relentless bleakness got heavy for me. interesting more than enjoyable."}, {"month": "january", "monthNum": 1, "rating": "4", "title": "On Earth We're Briefly Gorgeous", "author": "Ocean Vuong", "genre": "F", "comment": "vuong writes like a poet who wandered into a novel, which makes for a really lovely, touching book. Stopped and re-read a good number of sentences and paragraphs here, and was continually struck by how well he writes and conveys emotion. A letter from a son to a mother who can't read it, about immigration, addiction, and inherited pain."}, {"month": "january", "monthNum": 1, "rating": "4", "title": "Dead & Alive", "author": "Zadie Smith", "genre": "NF", "comment": "essay collection, half eulogies (didion, amis, mantel) and half odes to art and life and whatever's grabbed her lately. she's such a good thinker on the page and the range is wide, from artists to t\u00e1r to british hip hop. the best ones are as good as essays get. recommend."}, {"month": "january", "monthNum": 1, "rating": "4", "title": "Autocorrect", "author": "Etgar Keret", "genre": "F", "comment": "thirty-odd very short, very strange stories about people and technology and all the ways we misunderstand each other. keret does this thing where a story is absurd and then quietly devastating, and a lot of these land that punch in a few pages. uneven the way collections tend to be, but the good ones are so good. recommend."}, {"month": "january", "monthNum": 1, "rating": "3.5", "title": "Healing Back Pain", "author": "John E Sarno", "genre": "NF", "comment": "sarno's thesis, that a lot of chronic back pain is the body's response to repressed emotion rather than a structural problem, sounds like woo until you sit with it. i came in skeptical and left more convinced than i expected. the writing is repetitive and dated, but the core idea was genuinely useful to me. easy to dismiss before you've read it, but do recommend."}, {"month": "january", "monthNum": 1, "rating": "3", "title": "A Marriage at Sea", "author": "Sophie Elmhirst", "genre": "NF", "comment": "true story of a british couple who set out to sail the world in the 70s and end up stranded on a dinghy for months after a whale sinks their boat. elmhirst is a really good writer and the survival stuff is gripping. i wanted more of the marriage the title promises, but a solid, quick read."}, {"month": "january", "monthNum": 1, "rating": "2.5", "title": "Don't Believe Everything You Think", "author": "Joseph Nguyen", "genre": "NF", "comment": "the core idea, that it's our thinking about a situation rather than the situation that creates suffering, is decent, but there's about a long blog post's worth of material stretched into a book. repetitive and thin. if you've read much in this space, there's not a lot new here."}, {"month": "january", "monthNum": 1, "rating": "2", "title": "On the Power of Myth", "author": "Joseph Campbell & Bill Moyers", "genre": "NF", "comment": "the campbell/moyers conversations on myth and the hero's journey. i know it's a beloved classic, but it didn't do much for me. some interesting ideas about how myths carry meaning across cultures, but a lot felt vague and a little self-serious. kept waiting for it to click and it mostly didn't."}, {"month": "january", "monthNum": 1, "rating": "1", "title": "How to Talk to Anyone", "author": "Leil Lowndes", "genre": "NF", "comment": "a grab-bag of social tricks. smile techniques, eye-contact games, small-talk formulas \u2013 most of which read as dated and faintly manipulative. Very little felt genuine or like it'd survive contact with a real relationship. If it wasn't so short I wouldn't have finished. Not for me."}], "favs": [{"year": 2026, "month": 7, "rating": "5", "title": "My Friends", "author": "Fredrik Backman", "comment": "backman really nails what it's like to be a teenager \u2013 that mix of endless possibility and total uncertainty. warm story about friendship and the paintings that outlast us. a little saccharine at times, but genuinely one of my favorite fiction reads in years.", "genre": "Fiction", "when": "july 2026"}, {"year": 2026, "month": 7, "rating": "5", "title": "A Man Called Ove", "author": "Fredrik Backman", "comment": "read this right after my friends, and glad I did. Backman takes what could've been a cheap caricature of the rigid, rule-obsessed old grump and peels back the grief and tenderness underneath. both funny and parts made me choke up at times. a reminder of how much the people around us shape us without our noticing. strong recommend", "genre": "Fiction", "when": "july 2026"}, {"year": 2026, "month": 7, "rating": "4.5", "title": "The Inner Game of Tennis", "author": "Timothy Gallwey", "comment": "ostensibly about tennis, but really about getting out of your own way at anything. Gallwey's split between Self 1 (the hyper-aware, nagging, over-coaching mind) and Self 2 (the body that already knows how) has stuck with me. Punches way above its page count and makes sense that it's a classic. Highly recommend.", "genre": "Non-Fiction", "when": "july 2026"}, {"year": 2026, "month": 5, "rating": "4.5", "title": "How to Not Know", "author": "Simone Stolzoff", "comment": "rare book on uncertainty that doesn't try to sell you certainty by the end. moves through an sf tech worker who randomized his own life, ocd's clinical hunger for certainty, and the finding that anticipating an uncertain outcome is harder than the outcome itself. what stuck with me: every short-term grab for certainty atrophies our ability to sit with not knowing. accessible, quick read, easy to recommend.", "genre": "Non-Fiction", "when": "may 2026"}, {"year": 2025, "month": 12, "rating": "5", "title": "One Day Everyone Will Have Always Been Against This", "author": "Omar El Akkad", "comment": "part memoir, part indictment of western liberalism's willful blindness \u2013 how we make gross equivalences and look away from true horrors in exchange for lives of convenience. draws on his own disillusionment as an immigrant who once believed in the western project. doesn't let anyone off the hook", "genre": "Non-Fiction", "when": "december 2025"}, {"year": 2025, "month": 12, "rating": "4.5", "title": "Flat Earth", "author": "Anika Jade Levy", "comment": "broke nyc grad student working at a right-wing dating app while her wealthy friend becomes art world toast. sharp fragments, vicious friendship dynamics. nails the tension between people actually struggling and those performing the struggling artist while cashing checks from their parents.", "genre": "Fiction", "when": "december 2025"}, {"year": 2025, "month": 12, "rating": "4.5", "title": "A Brief History of Intelligence", "author": "Max Bennett", "comment": "evolutionary journey through how brains developed \u2013 from simple organisms to human consciousness. dense neuroscience made genuinely readable. changed how i think about thinking. one of my favorite non-fiction reads this year.", "genre": "Non-Fiction", "when": "december 2025"}, {"year": 2025, "month": 8, "rating": "5", "title": "Playworld", "author": "Adam Ross", "comment": "adam ross absolutely nails so much of being a fourteen year old, and the feeling of trying to carry adult things while not being an adult \u2013 all the weird anxieties and social dynamics that come with the age. his eye for detail is insane, capturing all these tiny moments that somehow add up to something huge. completely absorbed me. can't recommend enough.", "genre": "Fiction", "when": "august 2025"}, {"year": 2024, "month": 6, "rating": "5", "title": "Martyr!", "author": "Kaveh Akbar", "comment": "\"Absolutely loved this. Raw and lyrical exploration of addiction and identity that grabs you from the start. Jumps in time with stunning prose, and the way he handles complex themes while maintaining such beautiful language makes this unforgettable. Highly recommend.\"", "genre": "Fiction", "when": "june 2024"}, {"year": 2024, "month": 4, "rating": "5", "title": "A Swim in a Pond in the Rain", "author": "George Saunders", "comment": "\"Saunders breaks down Russian short stories with such warmth and insight that it transformed how I think about reading and writing. A masterclass in literary analysis that's surprisingly practical and deeply engaging.\"", "genre": "Non-Fiction", "when": "april 2024"}, {"year": 2024, "month": 4, "rating": "5", "title": "There's Always This Year", "author": "Hanif Abdurraqib", "comment": "\"Basketball becomes a lens for exploring American culture, personal history, and collective memory. Abdurraqib's ability to weave these threads together is nothing short of remarkable.\"", "genre": "Non-Fiction", "when": "april 2024"}, {"year": 2023, "month": 12, "rating": "5", "title": "Everything all at Once", "author": "Steph Catudal", "comment": "\"What an incredible read \u2013 Steph is a fantastic author, this story is gripping, and is a really emotional read. One of my favorite memoirs and overall pieces of writing I've encountered in the last few years.\"", "genre": "Non-Fiction", "when": "december 2023"}, {"year": 2023, "month": 1, "rating": "5", "title": "The Creative Act", "author": "Rick Rubin", "comment": "\"Really love Rick Rubin, for the music he's contributed to, to his philosophies on art and creativity, and this book is a wonderful distilling of that philosophy. Highly recommend anyone who does creative work or would like to buying this, reading a few pages at a time, and keeping close by.\"", "genre": "Non-Fiction", "when": "january 2023"}]};
const SPINES=["#4f5b63","#6b5d51","#5c6350","#7a544e","#455160","#6f6657","#544f61","#5d6b68","#7d6f4e","#4a5a56"];
const cap=s=>(s||"").trim();
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function ratingHtml(r){const v=parseFloat(r)||0;let h='';for(let i=0;i<5;i++){const f=Math.max(0,Math.min(1,v-i));h+=`<span class="st ${f>=1?'full':(f>=0.5?'half':'empty')}">★</span>`}return `<span class="rating">${h}</span>`}
const genreFull=g=>({F:'fiction','NF':'non-fiction','Fiction':'fiction','Non-Fiction':'non-fiction'}[g]||g||'').toLowerCase();
function spine(b,when){
  const h=hash((b.title+b.author).toLowerCase());
  const el=document.createElement("div");el.className="book";
  el.style.background=SPINES[h%SPINES.length];el.style.width=(31+(h%14))+"px";
  el.dataset.hashh = 150 + ((h>>4)%58);
  if((parseFloat(b.rating)||0)>=4.5) el.classList.add("fav");
  el.innerHTML=`<span class="spine-title">${cap(b.title)}</span><span class="spine-author">${cap(b.author)}</span>`;
  el.addEventListener("click",()=>select(el,b,when));return el;
}
function sizeSpines(){
  const CAP=258;
  document.querySelectorAll('.book').forEach(el=>{
    const title=el.querySelector('.spine-title'), author=el.querySelector('.spine-author');
    title.style.fontSize=''; title.style.maxHeight='none'; el.style.height='auto';
    let titleH=title.offsetHeight; const authorH=author.offsetHeight;
    const hashH=+el.dataset.hashh; const chrome=authorH+30;
    let bookH=Math.max(hashH, titleH+chrome);
    if(bookH>CAP){bookH=CAP; const avail=CAP-chrome; title.style.fontSize=(parseFloat(getComputedStyle(title).fontSize)*(avail/titleH)*0.97)+'px'; titleH=title.offsetHeight;}
    el.style.height=bookH+'px'; title.style.maxHeight=(bookH-chrome+8)+'px';
  });
}
function select(el,b,when){
  document.querySelectorAll(".book.selected").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");
  const meta=[`by ${cap(b.author).toLowerCase()}`];const g=genreFull(b.genre);if(g)meta.push(g);if(when)meta.push("read "+when);
  let m=`<span>${meta.join(" · ")}</span>`;if(b.rating)m+=ratingHtml(b.rating);
  const c=cap(b.comment);
  document.getElementById("detail").innerHTML=`<p class="d-title">${cap(b.title).toLowerCase()}</p><p class="d-meta">${m}</p>${c?`<p class="d-summary">${c}</p>`:`<p class="d-empty">detailed notes to come.</p>`}`;
  document.getElementById("detail").classList.add("show");
}
let MODE="thisyear";
function render(){
  const shelf=document.getElementById("shelf");shelf.innerHTML="";
  if(MODE==="thisyear"){DATA.thisyear.forEach(b=>shelf.appendChild(spine(b,b.month+" "+DATA.year)));}
  else{DATA.favs.forEach(b=>shelf.appendChild(spine(b,b.when)));}
  sizeSpines();
  document.getElementById("viewport").scrollLeft=0;document.getElementById("detail").classList.remove("show");updateArrows();
}
const vp=()=>document.getElementById("viewport");
function updateArrows(){const v=vp();document.getElementById("prev").disabled=v.scrollLeft<=2;document.getElementById("next").disabled=v.scrollLeft>=(v.scrollWidth-v.clientWidth-2)}
document.getElementById("prev").onclick=()=>{vp().scrollLeft-=vp().clientWidth*.8;setTimeout(updateArrows,350)};
document.getElementById("next").onclick=()=>{vp().scrollLeft+=vp().clientWidth*.8;setTimeout(updateArrows,350)};
vp().addEventListener("scroll",updateArrows,{passive:true});
(function(){let d=false,sx,sc;const v=vp();v.addEventListener("mousedown",e=>{d=true;v.classList.add("dragging");sx=e.pageX;sc=v.scrollLeft});window.addEventListener("mouseup",()=>{d=false;v.classList.remove("dragging");updateArrows()});window.addEventListener("mousemove",e=>{if(!d)return;v.scrollLeft=sc-(e.pageX-sx)})})();
