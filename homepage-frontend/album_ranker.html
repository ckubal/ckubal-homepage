<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Album Ranker</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#faf9f6;color:#1d1d1b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;font-weight:600;margin:0 0 2px}
.sub{font-size:13px;color:#6b6b66;margin:0 0 16px}
.statbar{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#6b6b66;margin-bottom:8px}
.statbar b{color:#1d1d1b;font-weight:600}
.progress{height:5px;background:#eceae3;border-radius:5px;overflow:hidden;margin-bottom:22px}
.progress>div{height:100%;background:#c8842f;width:0%;transition:width .3s}
.vs{display:grid;grid-template-columns:1fr 44px 1fr;align-items:stretch;gap:10px}
.card{background:#fff;border:1px solid #e6e3da;border-radius:14px;padding:26px 18px;cursor:pointer;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:150px;transition:border-color .12s,transform .08s,background .12s;user-select:none}
.card:hover{border-color:#c8842f;background:#fffdf8}.card:active{transform:scale(.985)}
.card .t{font-size:18px;font-weight:600;line-height:1.25}
.card .a{font-size:14px;color:#6b6b66;margin-top:7px}
.vsmid{display:flex;align-items:center;justify-content:center;font-size:12px;color:#9b9b94;font-weight:600}
.controls{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
button.b{background:#fff;border:1px solid #e6e3da;border-radius:9px;padding:8px 14px;font-size:13px;color:#444;cursor:pointer}
button.b:hover{border-color:#c2bfb4;background:#f4f2ec}
.hint{text-align:center;font-size:12px;color:#9b9b94;margin-top:12px}
.panel{margin-top:28px;border-top:1px solid #eceae3;padding-top:16px}
.rowi{display:flex;align-items:baseline;gap:10px;padding:5px 0;font-size:14px;border-bottom:1px solid #f1efe8}
.rowi .pos{width:34px;color:#9b9b94;font-variant-numeric:tabular-nums;font-size:13px;flex:none;text-align:right}
.rowi .nm{font-weight:500}.rowi .ar{color:#8a8a83;font-size:12px}
.rowi.frozen{opacity:.62}.rowi.frozen .pos{color:#c8842f}
.muted{color:#9b9b94;font-size:12px}
.rowi[draggable=true]{cursor:grab}.rowi.dragging{opacity:.4}.rowi.drag-over{border-top:2px solid #c8842f}
.rowi.clash .ar{color:#c8842f;font-weight:600}.clash-badge{color:#c8842f;font-size:11px;margin-left:5px}
.handle{color:#cfccc2;margin-right:4px;cursor:grab;user-select:none}
</style></head><body><div class="wrap">
<h1>&#127911; record collection ranker</h1>
<p class="sub">Your top 10 favorite albums of all time are frozen. Pick between two of your owned records each round to stack-rank the other 105. Progress saves automatically.</p>
<div class="statbar"><span><b id="s-comp">0</b> comparisons</span><span><b id="s-seen">0</b>/<span id="s-total">0</span> seen</span><span>coverage: <b id="s-cov">0</b>&times;<span class="muted"> (aim ~6&ndash;8)</span></span></div>
<div class="progress"><div id="bar"></div></div>
<div class="vs">
<div class="card" id="cardL" onclick="pick(0)"><div><div class="t" id="tL"></div><div class="a" id="aL"></div></div></div>
<div class="vsmid">vs</div>
<div class="card" id="cardR" onclick="pick(1)"><div><div class="t" id="tR"></div><div class="a" id="aR"></div></div></div>
</div>
<div class="controls"><button class="b" onclick="skip()">&#8596; too close / skip</button><button class="b" onclick="undo()">&#8617; undo</button><button class="b" onclick="toggleRank()" id="rankBtn">&#9636; show ranking</button></div>
<div class="hint">keyboard: &larr; left &middot; &rarr; right &middot; &darr; skip</div>
<div class="panel" id="rankPanel" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-weight:600">current ranking <span class="muted" id="rankNote"></span></div><div><button class="b" onclick="copyRank()">copy</button><button class="b" onclick="clearOrder()">&#8635; swipe order</button><button class="b" onclick="reset()">reset</button></div></div>

</div></div>

function toggleRank(){let p=document.getElementById('rankPanel');let s=p.style.display==='none';p.style.display=s?'block':'none';document.getElementById('rankBtn').textContent=s?'\u25a2 hide ranking':'\u25a2 show ranking';if(s)renderRank();}
function buildRankText(){var order=curOrder();var lines=FROZEN.map(function(s,i){return (i+1)+'. '+s[0]+' — '+s[1];});order.forEach(function(idx,i){lines.push((i+11)+'. '+POOL[idx][0]+' — '+POOL[idx][1]);});return lines.join('\n');}
function execCopy(text){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);return ok;}
function flash(msg){var t=document.createElement('div');t.textContent=msg;t.setAttribute('style','position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:9999');document.body.appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},1500);}
function showCopyModal(text){var ov=document.createElement('div');ov.setAttribute('style','position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px');ov.innerHTML='<div style="background:#fff;border-radius:12px;padding:16px;max-width:560px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.2)"><div style="font-weight:600;margin-bottom:8px">Your ranking — tap inside, select all, copy</div><textarea readonly style="width:100%;height:320px;font-size:12px;font-family:monospace;border:1px solid #e6e3da;border-radius:8px;padding:8px"></textarea><div style="text-align:right;margin-top:10px"><button class="b" id="mClose">close</button></div></div>';document.body.appendChild(ov);var ta=ov.querySelector('textarea');ta.value=text;setTimeout(function(){ta.focus();ta.select();},30);ov.addEventListener('click',function(e){if(e.target===ov)ov.parentNode.removeChild(ov);});ov.querySelector('#mClose').addEventListener('click',function(){ov.parentNode.removeChild(ov);});}
function copyRank(){var text=buildRankText();var n=FROZEN.length+curOrder().length;var ok=function(){flash('Copied '+n+' albums');};var fail=function(){if(execCopy(text)){ok();}else{showCopyModal(text);}};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fail);}else{fail();}}
function reset(){if(confirm('Reset all comparisons?')){localStorage.removeItem(LS);load();render();}}
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')pick(0);else if(e.key==='ArrowRight')pick(1);else if(e.key==='ArrowDown'){e.preventDefault();skip();}});
render();
</script></body></html>
